apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing-engine
  namespace: perf-lab
  labels: {app: pricing-engine}
spec:
  replicas: 1
  selector:
    matchLabels: {app: pricing-engine}
  template:
    metadata:
      labels: {app: pricing-engine}
    spec:
      containers:
        - name: pricing-engine
          image: pricing-engine:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          env:   # régime nominal
            - {name: BASE_LATENCY_MS, value: "10"}
            - {name: SLOW_RATIO, value: "0"}
            - {name: SLOW_LATENCY_MS, value: "600"}
            - {name: ERROR_RATE, value: "0"}
            - {name: CPU_WORK, value: "0"}
          resources:
            requests: {cpu: 100m, memory: 32Mi}
            limits: {cpu: "1", memory: 128Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pricing-engine
  namespace: perf-lab
spec:
  type: ClusterIP
  selector: {app: pricing-engine}
  ports:
    - {name: http, port: 8080, targetPort: http}
